name: Deploy to VPS
on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # Existing repo secret, mapped to the name the code reads. Kept as-is so
      # the secret does not have to be re-created.
      PUBLIC_EDUCATION_CONSULTANT_WHATSAPP: ${{ secrets.WA_PHONE_NUMBER }}
      # Analytics has a default in code; set here so it is visible in the build.
      PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID || 'G-FNT01JRZN7' }}
      PUBLIC_HOTJAR_ID: ${{ secrets.PUBLIC_HOTJAR_ID || '6772321' }}
      SITE_URL: https://academy.pitcar.co.id
      # Lead API. Empty until the backend is deployed — the form then hands the
      # summary to WhatsApp directly instead of failing in front of a visitor.
      PUBLIC_LEAD_API_BASE_URL: ${{ secrets.PUBLIC_LEAD_API_BASE_URL }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install Dependencies & Build
        run: |
          test -n "$PUBLIC_EDUCATION_CONSULTANT_WHATSAPP" || (echo "WA_PHONE_NUMBER secret is required" && exit 1)
          test -n "$PUBLIC_GA_ID" || (echo "PUBLIC_GA_ID resolved empty" && exit 1)
          npm install
          npm run build
          
      - name: Deploy to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "dist/"
          target: "/var/www/pitcar-academy-lp"
          
      - name: Reload Nginx
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo systemctl reload nginx
