name: Deploy to VPS
on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      WA_PHONE_NUMBER: ${{ secrets.WA_PHONE_NUMBER }}
      WA_WEBHOOK_URL: ${{ secrets.WA_WEBHOOK_URL }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install Dependencies & Build
        run: |
          test -n "$WA_PHONE_NUMBER" || (echo "WA_PHONE_NUMBER secret is required" && exit 1)
          npm install
          npm run build
          
      - name: Deploy to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "dist/"
          target: "/var/www/pitcar-academy-lp"
          
      - name: Reload Nginx
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo systemctl reload nginx
